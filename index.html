<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>오늘의 쿠팡 특가</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0F1424; color: #fff; font-family: -apple-system, BlinkMacSystemFont,
         "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; }
  header { text-align: center; padding: 12px 0 8px; }
  header h1 { font-size: 26px; letter-spacing: -0.5px; }
  header h1 .tag { color: #FFD600; }
  header p { color: #9aa3b8; font-size: 13px; margin-top: 6px; }
  .disclosure { background: #1a2036; color: #aeb6cc; font-size: 11px; line-height: 1.5;
                 border-radius: 10px; padding: 10px 12px; margin: 14px 0 18px; text-align: center; }
  .goldbox { display: block; text-align: center; background: #FFD600; color: #0F1424;
              font-weight: 800; font-size: 17px; text-decoration: none; padding: 16px;
              border-radius: 14px; margin-bottom: 22px; }
  .goldbox:active { transform: scale(0.98); }
  .card { display: flex; gap: 12px; background: #1a2036; border-radius: 14px;
           padding: 10px; margin-bottom: 12px; align-items: center; }
  .thumb { width: 96px; height: 96px; object-fit: cover; border-radius: 10px;
            background: #000; flex-shrink: 0; }
  .body { flex: 1; min-width: 0; }
  .title { font-size: 14px; line-height: 1.4; font-weight: 600; display: -webkit-box;
            -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .price { color: #FFD600; font-weight: 800; font-size: 18px; margin: 4px 0 8px; }
  .buy { display: inline-block; background: #FF3B30; color: #fff; font-weight: 700; font-size: 13px;
          text-decoration: none; padding: 8px 14px; border-radius: 999px; }
  .buy.disabled { background: #444b60; }
  .empty { text-align: center; color: #9aa3b8; padding: 40px 0; }
  footer { text-align: center; color: #6b7490; font-size: 11px; margin-top: 24px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🛒 오늘의 <span class="tag">쿠팡 특가</span></h1>
      <p>매일 업데이트 · 아래 상품을 눌러 바로 이동</p>
    </header>
    <div class="disclosure">이 영상은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div>
    
      <div class="card">
        <img class="thumb" src="https://i.ytimg.com/vi/6VMtXaNniPs/hqdefault.jpg" alt="" loading="lazy">
        <div class="body">
          <div class="title">카누 마일드 아메리카노 미니 — 이 더위에 책상 위 아이스 한 잔</div>
          <div class="price">2만원대</div>
          <a class="buy" href="https://link.coupang.com/a/flUzKerAT6" target="_blank" rel="noopener nofollow sponsored">구매하기 →</a>
        </div>
      </div>
    <footer>가격·재고는 변동될 수 있어요 · 촬영 시점 기준</footer>
  </div>
</body>
</html>
